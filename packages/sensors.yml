.throttle-filter: &throttle-filter
  - throttle_average: "${filter_time}"
  - filter_out: nan
  - sliding_window_moving_average:
      {send_every: "${filter_send_every}", window_size: "${filter_window_size}"}

.throttle-filter-round-tens: &throttle-filter-round-tens
  - throttle_average: "${filter_time}"
  - filter_out: nan
  - sliding_window_moving_average:
      {send_every: "${filter_send_every}", window_size: "${filter_window_size}"}
  - lambda: return round(x/10)*10;

.throttle-filter-e-3: &throttle-filter-e-3
  - throttle_average: "${filter_time}"
  - filter_out: nan
  - sliding_window_moving_average:
      {send_every: "${filter_send_every}", window_size: "${filter_window_size}"}
  - multiply: 0.001

sensor:
  - platform: template
    id: away_indicator_raw # PDO 16
    name: "away_indicator_raw"
    internal: true
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            id(away_indicator).publish_state(x == 7);
            id(device_state).publish_state(std::to_string(int(x)));

  - platform: template
    id: fan_level_raw # PDO 65
    name: "fan_level_raw"
    internal: true
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: id(fan_level).publish_state(std::to_string(int(x)));
        - if:
            condition:
              lambda: "return int(x) == 0;"
            then:
              - fan.turn_off: comfoair_fan
            else:
              - fan.turn_on:
                  id: comfoair_fan
                  speed: !lambda "return int(x);"

  - platform: template
    id: manual_mode_raw # PDO 56 (255 = auto, 1 = manual mode active)
    internal: true
    accuracy_decimals: 0
    on_value:
      then:
        # Re-run the PDO 49 filter now that the manual-mode flag is known.
        - lambda: |-
            if (id(operating_mode).has_state())
              id(operating_mode).publish_state(id(operating_mode).get_raw_state());

